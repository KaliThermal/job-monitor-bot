
# Job Monitor Bot - KTH IT / Network / Cybersecurity
# Fokus: Deltid, extrajobb, studentjobb och internships
# Plats: Stockholm och Sverige

settings:
  enabled: true
  max_results_per_query: 10
  min_seconds_between_queries: 2.0
  max_consecutive_failures: 3

  # Tillat bade kontorsjobb, hybrid och remote
  query_negative_terms: []

  # Senaste veckan vid forsta sokningen
  # Byt till "qdr:d" for daglig bevakning senare
  serper_time_filter: "qdr:w"

  # Prioritera svenska Google-resultat
  serper_countries: ["se"]

  serper_max_retries_per_query: 2
  serper_stop_on_rate_limit: true

# Varje rad nedan blir en Google-sokning
keywords:

  # 1. SOC och Security Operations
  - '("SOC Analyst" OR "SOC-operatör" OR "Security Operations Center") (deltid OR extrajobb OR student OR internship OR "part-time") (Stockholm OR Sverige OR Sweden)'

  # 2. NOC och Network Operations
  - '("NOC" OR "Network Operations Center" OR "NOC Technician") (deltid OR extrajobb OR student OR internship OR "part-time") (Stockholm OR Sverige OR Sweden)'

  # 3. Network Engineer och natverksteknik
  - '("Network Engineer" OR "Network Technician" OR "nätverkstekniker" OR "nätverksingenjör") (deltid OR extrajobb OR student OR internship OR "part-time") (Stockholm OR Sverige OR Sweden)'

  # 4. Cybersakerhet och IT-sakerhet
  - '("cybersäkerhet" OR "cybersecurity" OR "IT-säkerhet") (deltid OR extrajobb OR student OR internship OR "part-time") (Stockholm OR Sverige OR Sweden)'

  # 5. Security Analyst och Security Engineer
  - '("Security Analyst" OR "Security Engineer" OR "Security Operations") (student OR internship OR deltid OR "part-time") (Stockholm OR Sverige OR Sweden)'

  # 6. IT-drift och infrastruktur
  - '("IT-drift" OR "drifttekniker" OR "IT Operations" OR "infrastrukturtekniker") (deltid OR extrajobb OR student OR internship) (Stockholm OR Sverige)'

  # 7. Systemadministration och Linux
  - '("systemadministratör" OR "Systems Administrator" OR "Linux Administrator") (deltid OR extrajobb OR student OR internship) (Stockholm OR Sverige)'

  # 8. Cloud, Scalable Systems och DevOps
  - '("Cloud Engineer" OR "Cloud Operations" OR "Infrastructure Engineer" OR "DevOps") (student OR internship OR deltid OR "part-time") (Stockholm OR Sverige OR Sweden)'

  # 9. Studenter inom IT och natverk
  - '("studentmedarbetare" OR "working student" OR "student worker") (IT OR nätverk OR säkerhet OR infrastructure) (Stockholm OR Sverige OR Sweden)'

  # 10. IT-support och IT-tekniker
  - '("IT-support" OR "IT-tekniker" OR "helpdesk") (deltid OR extrajobb OR student OR "part-time") (Stockholm OR Sverige OR Sweden)'

# Google sokning over flera jobbplattformar
sites:

